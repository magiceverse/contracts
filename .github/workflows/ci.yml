name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, ci]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        env:
          # Our own self-hosted runner (not a GitHub-hosted image): setup-php installs PHP itself.
          runner: self-hosted
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/pest
